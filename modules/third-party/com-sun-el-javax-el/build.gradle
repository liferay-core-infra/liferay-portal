import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task patch(type: PatchTask)

dependencies {
	compileOnly group: "org.glassfish", name: "jakarta.el", transitive: false, version: "3.0.4"
}

liferay {
	deployDir = file("${liferayHome}/osgi/static")
}

patch {
	ext {
		autoClean = false
	}

	fileNames "com/sun/el/parser/ELParser.java"
	fileNames "javax/el/BeanELResolver.java"

	originalLibModuleName = "jakarta.el"
}