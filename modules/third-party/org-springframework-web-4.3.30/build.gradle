import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task patch(type: PatchTask)

dependencies {
	api group: "org.springframework", name: "spring-web", version: "4.3.30.RELEASE"
}

jarSources {
	mustRunAfter patch
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/springframework/web/util/UriComponentsBuilder.java"

	originalLibModuleName = "spring-web"
}